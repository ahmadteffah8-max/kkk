plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pixelstudio.app'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en', 'ar']
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly on a phone.
            // Replace with your own keystore before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
