name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run engine self tests
        run: ./tools/run-core-tests.sh

  apk:
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release (easy download on a phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PixelStudio.apk
          gh release create "build-${{ github.run_number }}" PixelStudio.apk \
            --title "Pixel Studio build ${{ github.run_number }}" \
            --notes "Debug APK. Download PixelStudio.apk and install it."
