# Alternative free build service: https://codemagic.io (connect the repo, pick this workflow).
workflows:
  pixelz-apk:
    name: Pixelz debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Engine tests
        script: ./tools/run-core-tests.sh
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
